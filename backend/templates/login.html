<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translations.login }}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" data-i18n="welcome">{{ translations.welcome }}</div>
            <nav>
                <ul>
                    <li><a href="/" data-i18n="home">{{ translations.home }}</a></li>
                    <li><a href="/register" data-i18n="register">{{ translations.register }}</a></li>
                </ul>
            </nav>
            <div class="language-selector">
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="ar">AR</button>
                <button class="lang-btn" data-lang="fr">FR</button>
                <button class="lang-btn" data-lang="es">ES</button>
            </div>
        </header>

        <main>
            <div class="auth-container">
                <h2 style="text-align: center; margin-bottom: 30px;" data-i18n="login_title">{{ translations.login_title }}</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username" data-i18n="username">{{ translations.username }}</label>
                        <input type="text" id="username" name="username" required 
                               data-i18n-placeholder="username" placeholder="{{ translations.username }}">
                    </div>
                    <div class="form-group">
                        <label for="password" data-i18n="password">{{ translations.password }}</label>
                        <input type="password" id="password" name="password" required
                               data-i18n-placeholder="password" placeholder="{{ translations.password }}">
                    </div>
                    <button type="submit" class="btn" data-i18n="login">{{ translations.login }}</button>
                </form>
                <p style="text-align: center; margin-top: 20px;">
                    <span data-i18n="no_account">Don't have an account?</span>
                    <a href="/register" style="color: #4facfe; margin-left: 5px;" data-i18n="register">{{ translations.register }}</a>
                </p>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 MultiLang Website. All rights reserved.</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
